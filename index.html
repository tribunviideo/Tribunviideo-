<!DOCTYPE html>

<!-- KODE SOCIAL BAR -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* STYLING POP-UP DOWNLOAD */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.modal-content {
    background: #1a1a1a;
    color: #fff;
    padding: 30px 25px;
    border-radius: 12px;
    text-align: center;
    position: relative;
    max-width: 90%;
    width: 340px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    border: 1px solid #333;
}

.close-btn {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 22px;
    cursor: pointer;
    color: #888;
    background: none;
    border: none;
}

.close-btn:hover {
    color: #fff;
}

.modal-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #f1f1f1;
}

.modal-desc {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 20px;
    line-height: 1.4;
}

.download-btn {
    background: #ff4757;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
    transition: background 0.2s;
}

.download-btn:hover {
    background: #ff6b81;
}
</style>
</head>
<body>

<div class="player-container">
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<!-- POP-UP MODAL DOWNLOAD -->
<div id="downloadModal" class="modal-overlay">
    <div class="modal-content">
        <button id="closeModal" class="close-btn">&times;</button>
        <div class="modal-title">Video Siap Diunduh</div>
        <div class="modal-desc">Silakan klik tombol di bawah untuk memproses dan mengunduh file video kualitas HD.</div>
        <button id="downloadBtn" class="download-btn">Download Video</button>
    </div>
</div>

<script>
/* =========================
   KONFIGURASI
========================= */
const JSON_URL = "videos.json";

/* SMART LINK & SHOPEE */
const DIRECT_LINK = "https://asiaso.org/4/dd0fd223f44b88381ac7e49fca0d0310";
const SHOPEE_LINK = "https://s.shopee.co.id/2VrzPfIQbA";

const video = document.getElementById("player");
const modal = document.getElementById("downloadModal");
const closeBtn = document.getElementById("closeModal");
const downloadBtn = document.getElementById("downloadBtn");

let clicked = false;

/* KUNCI SESI AGAR POP-UP HANYA MUNCUL SEKALI */
const sessionKey = "popup_shown_" + window.location.pathname;
let popupShown = sessionStorage.getItem(sessionKey) === "true";

function getRandomAd(){
    const ads = [DIRECT_LINK, SHOPEE_LINK];
    return ads[Math.floor(Math.random() * ads.length)];
}

function triggerPopup() {
    if (popupShown) return;
    popupShown = true;
    sessionStorage.setItem(sessionKey, "true");
    
    video.pause(); // Jeda video saat pop-up muncul
    modal.style.display = "flex";
}

/* TOMBOL X (TUTUP) IKUT MEMICU REDIRECT ACAK */
closeBtn.addEventListener("click", function() {
    window.location.href = getRandomAd();
});

/* TOMBOL DOWNLOAD MEMICU REDIRECT ACAK */
downloadBtn.addEventListener("click", function() {
    window.location.href = getRandomAd();
});

/* =========================
   AMBIL ID DARI PATH URL
========================= */
const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
const id = decodeURIComponent(path);

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok) throw new Error("Gagal mengambil videos.json");
    return res.json();
})
.then(data => {
    const vids = data.videos;
    const selected = vids.find(v => v.id === id || (v.cdn && v.cdn.includes(id)));

    if(!selected || !id){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA INTERAKSI & TIMER 30 DETIK
========================= */
video.addEventListener("click", function(){
    if(!clicked){
        clicked = true;
        return;
    }
    if(!popupShown) {
        triggerPopup();
    }
});

video.addEventListener("timeupdate", function(){
    if(!popupShown && video.currentTime >= 30){
        triggerPopup();
    }
});
</script>

</body>
</html>
