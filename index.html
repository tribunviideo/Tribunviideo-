<!-- KODE SOCIAL BAR (INTERACTIVE + DELAY DENGAN SESSION STORAGE) -->
<script>
function injectSocialBar() {
    if (!sessionStorage.getItem('socialbar_loaded')) {
        sessionStorage.setItem('socialbar_loaded', 'true');
        var script = document.createElement('script');
        script.setAttribute('data-cfasync', 'false');
        script.src = "https://brijmohan.org/14/b4a9ed5c126891415a3d877a07f7c975";
        document.body.appendChild(script);
    }
}

// 1. Muat otomatis setelah delay 5 detik
var socialBarTimer = setTimeout(injectSocialBar, 5000);

// 2. Muat langsung saat ada interaksi pertama user (klik/tap)
function triggerSocialBarOnInteraction() {
    clearTimeout(socialBarTimer);
    injectSocialBar();
    window.removeEventListener('click', triggerSocialBarOnInteraction);
    window.removeEventListener('touchstart', triggerSocialBarOnInteraction);
}

window.addEventListener('click', triggerSocialBarOnInteraction);
window.addEventListener('touchstart', triggerSocialBarOnInteraction);
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>
<body>

<div class="player-container">
    <!-- PEMUTAR VIDEO NATIVE (Menggunakan preload="metadata" agar browser bisa membaca frame awal video untuk thumbnail) -->
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<script>
/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK = "https://asiaso.org/4/7649a90278eb93662c45c0294f6fb8fc";

/* SHOPEE */
const SHOPEE_LINK = "https://s.shopee.co.id/2VrzPfIQbA";

const video = document.getElementById("player");

let clicked = false;
let redirected = false;

/* =========================
   PILIH IKLAN RANDOM
========================= */
function getRandomAd(){
    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];
    return ads[Math.floor(Math.random() * ads.length)];
}

/* =========================
   REDIRECT RANDOM
========================= */
function redirectRandom(){
    if(redirected) return;
    redirected = true;
    window.location.href = getRandomAd();
}

/* =========================
   AMBIL ID VIDEO DARI URL (#)
========================= */
const hash = window.location.hash;
const id = decodeURIComponent(hash.replace(/^#\/?/, ''));

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok) throw new Error("Gagal mengambil videos.json");
    return res.json();
})
.then(data => {
    const selected = data.videos.find(v => v.id === id);

    if(!selected){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    // Otomatis mengambil cuplikan frame pertama dari link CDN video sebagai thumbnail
    video.src = selected.cdn + "#t=0.5";
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA KLIK & REDIRECT
========================= */
video.addEventListener("click", function(){
    if(!clicked){
        clicked = true;
        return;
    }
    redirectRandom();
});

/* =========================
   REDIRECT SETELAH 20 DETIK
========================= */
video.addEventListener("timeupdate", function(){
    if(!redirected && video.currentTime >= 20){
        redirectRandom();
    }
});
</script>

</body>
</html>
