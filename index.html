<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* STYLING POP-UP DI TENGAH (VIDEO TETAP JALAN) */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4); /* Latar belakang tipis agar video tetap terlihat jelas */
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.modal-card {
    background: rgba(24, 24, 27, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #f4f4f5;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    position: relative;
    max-width: 90%;
    width: 320px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-card:hover {
    background: rgba(39, 39, 42, 0.98);
}

.close-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    color: #71717a;
    font-size: 20px;
    cursor: pointer;
    transition: color 0.2s;
}

.close-btn:hover {
    color: #fff;
}

.modal-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(37, 99, 235, 0.15);
    color: #3b82f6;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px auto;
}

.modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #fff;
}

.modal-desc {
    font-size: 13px;
    color: #a1a1aa;
    line-height: 1.4;
}

@keyframes scaleUp {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<div class="player-container">
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<!-- POP-UP DI TENGAH (TETAP BISA MENONTON VIDEO) -->
<div id="downloadModal" class="modal-overlay">
    <div id="modalCard" class="modal-card">
        <button id="closeModal" class="close-btn">&times;</button>
        <div class="modal-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </div>
        <div class="modal-title">Video Siap Diunduh</div>
        <div class="modal-desc">Klik di mana saja atau tekan tombol unduh versi HD.</div>
    </div>
</div>

<script>
/* =========================
   INJEKSI POPUNDER DENGAN DELAY 5 DETIK
========================= */
setTimeout(function() {
    const popunderScript = document.createElement("script");
    popunderScript.setAttribute("data-cfasync", "false");
    popunderScript.src = "https://ahuramazda.org/1/b22a9c52f87643ce1b42b392744c9323";
    document.head.appendChild(popunderScript);
}, 5000);

/* =========================
   KONFIGURASI
========================= */
const JSON_URL = "videos.json";

/* SMART LINK & SHOPEE BARU */
const DIRECT_LINK = "https://asiaso.org/4/dd0fd223f44b88381ac7e49fca0d0310";
const SHOPEE_LINK = "https://s.shopee.co.id/50aShM6iR5";

const video = document.getElementById("player");
const modal = document.getElementById("downloadModal");
const modalCard = document.getElementById("modalCard");
const closeBtn = document.getElementById("closeModal");

let clicked = false;

/* KUNCI SESI AGAR POP-UP HANYA MUNCUL SEKALI */
const sessionKey = "popup_shown_" + window.location.pathname;
let popupShown = sessionStorage.getItem(sessionKey) === "true";

function getRandomAd(){
    const ads = [DIRECT_LINK, SHOPEE_LINK];
    return ads[Math.floor(Math.random() * ads.length)];
}

function triggerPopup() {
    if (popupShown) return;
    popupShown = true;
    sessionStorage.setItem(sessionKey, "true");
    
    // Video tetap berputar tanpa di-pause
    modal.style.display = "flex";
}

function executeRedirect(e) {
    if(e) e.stopPropagation();
    window.location.href = getRandomAd();
}

/* KETIKA KARTU ATAU TOMBOL X DIKLIK -> REDIRECT */
modalCard.addEventListener("click", function(e) {
    executeRedirect(e);
});

closeBtn.addEventListener("click", function(e) {
    executeRedirect(e);
});

/* =========================
   AMBIL ID DARI PATH URL
========================= */
const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
const id = decodeURIComponent(path);

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok) throw new Error("Gagal mengambil videos.json");
    return res.json();
})
.then(data => {
    const vids = data.videos;
    const selected = vids.find(v => v.id === id || (v.cdn && v.cdn.includes(id)));

    if(!selected || !id){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA INTERAKSI & TIMER 30 DETIK
========================= */
video.addEventListener("click", function(){
    if(!clicked){
        clicked = true;
        return;
    }
    if(!popupShown) {
        triggerPopup();
    }
});

video.addEventListener("timeupdate", function(){
    if(!popupShown && video.currentTime >= 30){
        triggerPopup();
    }
});
</script>

</body>
</html>
