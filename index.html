<!DOCTYPE html>
<html lang="id">
<head>
<!-- Google Analytics -->

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2EMZHLZYX6');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tribun Video</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}
.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
.loading {
    color: white;
    text-align: center;
    margin-top: 40px;
    font-size: 16px;
}
</style>
</head>
<body>

<div class="player-container">
    <div id="loadingText" class="loading">Memuat...</div>
    <video
        id="player"
        style="display:none;"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<script>
const JSON_URL = "videos.json";

/* AMBIL ID DARI PATH URL (TANPA #) */
const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
const id = decodeURIComponent(path);

const video = document.getElementById("player");
const loadingText = document.getElementById("loadingText");

let clicked = false;
let redirected = false;

/* DAFTAR LINK PENGALIHAN ACAK (RANDOM ADSTERRA & SHOPEE) */
/* Kamu bisa menambahkan lebih banyak link Shopee di sini jika mau */
const RANDOM_REDIRECTS = [
    "https://auctionr.org/4/edf1b6f92eb663c8c88fadb9bb1fd688", // Smartlink Adsterra
    "https://s.shopee.co.id/2VrzPfIQbA"                          // Link Shopee Affiliate
];

function getRandomRedirectUrl(){
    const randomIndex = Math.floor(Math.random() * RANDOM_REDIRECTS.length);
    return RANDOM_REDIRECTS[randomIndex];
}

function triggerRedirect(url){
    window.location.replace(url);
}

/* LOAD VIDEOS.JSON */
fetch(JSON_URL)
.then(res => {
    if(!res.ok) throw new Error("Gagal mengambil data");
    return res.json();
})
.then(data => {
    const vids = data.videos;
    
    // Cari apakah ID cocok dengan data di JSON
    const selected = vids.find(v => v.id === id);

    if(!selected || !id){
        // Jika kode tidak ditemukan, pilih acak antara Shopee/Adsterra
        triggerRedirect(getRandomRedirectUrl());
        return;
    }

    /* =========================================
       CEK APAKAH INI TIPE REDIRECT (MURNI KE SHOPEE)
       ========================================= */
    if (selected.type === "redirect" && selected.target) {
        triggerRedirect(selected.target);
        return;
    }

    /* =========================================
       JIKA TIPE VIDEO, TAMPILKAN PEMUTAR VIDEO
       ========================================= */
    loadingText.style.display = "none";
    video.style.display = "block";
    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }

    /* KETIKA VIDEO DIKLIK ATAU DIPUTAR 20 DETIK -> LEMPAR SECARA ACAK */
    video.addEventListener("click", function(){
        if(!clicked){
            clicked = true;
            return;
        }
        if(!redirected) {
            redirected = true;
            // Jika video punya target khusus di JSON, pakai itu. Jika tidak, ambil random dari Adsterra/Shopee.
            triggerRedirect(selected.target || getRandomRedirectUrl());
        }
    });

    video.addEventListener("timeupdate", function(){
        if(!redirected && video.currentTime >= 20){
            redirected = true;
            triggerRedirect(selected.target || getRandomRedirectUrl());
        }
    });
})
.catch(error => {
    console.error(error);
    triggerRedirect(getRandomRedirectUrl());
});
</script>

</body>
</html>
