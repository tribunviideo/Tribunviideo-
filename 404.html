
<!DOCTYPE html>
<html lang="id">
<head>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2EMZHLZYX6');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>
<body>

<div class="player-container">
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<script>
/* =========================
   KONFIGURASI
========================= */
const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK = "https://asiaso.org/4/72e0a845bfa4ab89f521a34e2fda898d";

/* SHOPEE */
const SHOPEE_LINK = "https://s.shopee.co.id/2VrzPfIQbA";

const video = document.getElementById("player");

let clicked = false;
let redirected = false;

function getRandomAd(){
    const ads = [DIRECT_LINK, SHOPEE_LINK];
    return ads[Math.floor(Math.random() * ads.length)];
}

function redirectRandom(){
    if(redirected) return;
    redirected = true;
    window.location.href = getRandomAd();
}

/* =========================
   AMBIL ID DARI PATH URL (TANPA #)
========================= */
const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
const id = decodeURIComponent(path);

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok) throw new Error("Gagal mengambil videos.json");
    return res.json();
})
.then(data => {
    const vids = data.videos;
    const selected = vids.find(v => v.id === id || (v.cdn && v.cdn.includes(id)));

    if(!selected || !id){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA KLIK & REDIRECT
========================= */
video.addEventListener("click", function(){
    if(!clicked){
        clicked = true;
        return;
    }
    redirectRandom();
});

video.addEventListener("timeupdate", function(){
    if(!redirected && video.currentTime >= 20){
        redirectRandom();
    }
});
</script>

</body>
</html>
