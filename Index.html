<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family: sans-serif;
}

.player-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>
<body>

<div class="player-container">
    <!-- PEMUTAR VIDEO NATIVE -->
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>
</div>

<script>
/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK (BARU) */
const DIRECT_LINK = "https://asiaso.org/4/7649a90278eb93662c45c0294f6fb8fc";

/* SHOPEE */
const SHOPEE_LINK = "https://s.shopee.co.id/2VrzPfIQbA";

const video = document.getElementById("player");

let clicked = false;
let redirected = false;

/* =========================
   PILIH IKLAN RANDOM
========================= */
function getRandomAd(){
    const ads = [
        DIRECT_LINK,
        SHOPEE_LINK
    ];
    const randomIndex = Math.floor(Math.random() * ads.length);
    return ads[randomIndex];
}

/* =========================
   REDIRECT RANDOM
========================= */
function redirectRandom(){
    if(redirected) return;
    redirected = true;
    const selectedAd = getRandomAd();
    window.location.href = selectedAd;
}

/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */
const hash = window.location.hash;
const id = decodeURIComponent(hash.replace(/^#\/?/, ''));

/* =========================
   LOAD VIDEOS.JSON
========================= */
fetch(JSON_URL)
.then(res => {
    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }
    return res.json();
})
.then(data => {
    const vids = data.videos;
    const selected = vids.find(v => v.id === id);

    if(!selected){
        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
        return;
    }

    video.src = selected.cdn;

    if(selected.poster) {
        video.poster = selected.poster;
    } else {
        video.src = selected.cdn + "#t=0.5";
    }
})
.catch(error => {
    console.error(error);
    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
});

/* =========================
   LOGIKA KLIK & REDIRECT
========================= */
video.addEventListener("click", function(){
    /* KLIK PERTAMA */
    if(!clicked){
        clicked = true;
        return;
    }

    /* KLIK KEDUA DAN SETERUSNYA REDIRECT */
    redirectRandom();
});

/* =========================
   REDIRECT SETELAH 20 DETIK
========================= */
video.addEventListener("timeupdate", function(){
    if(!redirected && video.currentTime >= 20){
        redirectRandom();
    }
});
</script>

</body>
</html>
